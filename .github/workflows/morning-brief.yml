name: 每日更新晨报

on:
  push:
    branches: [main]
  schedule:
    # 北京时间 07:00~09:00 五个时段尝试（GitHub 定时可能延迟，多时段保底，当天只更新一次）
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查今天是否已更新
        id: check
        run: |
          UPDATED="false"
          if [ -f data.json ]; then
            UPDATED=$(python -c "import json; from datetime import datetime; from zoneinfo import ZoneInfo; d=json.load(open('data.json', encoding='utf-8')); print('true' if d.get('date')==datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat() else 'false')")
          fi
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "updated=$UPDATED"

      - name: 生成当日数据
        if: steps.check.outputs.updated != 'true'
        run: python generate.py

      - name: 提交更新（当天已更新或 push 触发时不提交，避免循环）
        if: github.event_name != 'push' && steps.check.outputs.updated != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "每日晨报数据更新"
          file_pattern: data.json
