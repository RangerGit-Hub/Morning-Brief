name: 每日更新晨报

on:
  push:
    branches: [main]
  schedule:
    # 每天 00:00 UTC = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成当日数据
        run: python generate.py

      - name: 提交更新（仅定时/手动触发，避免循环）
        if: github.event_name != 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "每日晨报数据更新"
          file_pattern: site/data.json
